          - Frewin et al. (2026) - earliest evidence of verb comprehension in infancy, demonstrating that 10-month-olds recognise mislabelled actions.
          - Frewin et al. (2025) - showed that infants’ motor development is more strongly associated with verb than noun vocabulary growth, suggesting a role for infants’ own actions in verb learning.

